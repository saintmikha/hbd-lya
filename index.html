<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, Baby!</title>
    <style>
        @font-face {
            font-family: 'Pix32';
            src: url('Pix32.woff') format('woff'),
                 url('Pix32.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .app-window {
            height: 100vh;
            aspect-ratio: 4 / 3;
            background: #fae1f0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            height: 60px;
            background-color: #f297c8;
            border-bottom: 4px solid #bdd4f1;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .settings-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            cursor: pointer;
        }

        .main-body {
            flex: 1;
            background: radial-gradient(circle at 15% 20%, #ffffff 0%, #fae1f0 60%);
            display: flex;
            position: relative;
        }

        .left-half {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid #ffffff;
        }

        .welcome-text {
            font-family: 'Pix32', 'Pixelify Sans', sans-serif;
            font-weight: bold;
            font-style: normal;
            font-size: 44px;
            color: #dd8bc9;
            letter-spacing: 1px;
            image-rendering: pixelated;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.6);
            display: inline-block;
            transform-origin: center center;
            transform: skewX(-15deg);
        }

        .right-half {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sprite-placeholder {
            width: 70px;
            height: 70px;
            border: 3px solid #ffd966;
            box-sizing: border-box;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            image-rendering: pixelated;
        }

        .sprite-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bottom-bar {
            height: 60px;
            background-color: #f297c8;
            border-top: 4px solid #bdd4f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .bottom-icons {
            display: flex;
            gap: 15px;
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            cursor: pointer;
        }

        .blue-blocks-container {
            display: flex;
            gap: 5px;
        }

        .blue-block {
            width: 28px;
            height: 28px;
            background-color: #0000ff;
            border: 2px solid #ffffff;
            box-sizing: border-box;
        }

        /* ============================================
           INTRO SEQUENCE
           ============================================ */
        .intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 1.5s steps(12, end);
        }

        .intro-overlay.is-hidden {
            opacity: 0;
        }

        .intro-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            opacity: 0;
            transition: opacity 1.5s steps(12, end);
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;
        }

        .intro-image.is-visible {
            opacity: 1;
        }

        .fade-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s steps(12, end);
        }

        .fade-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================
           CLICK-TO-START GATE
           Blocks the intro until the user clicks once.
           That click unlocks autoplay for boot.mp3.
           ============================================ */
        .gate-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e0e0e0;
            font-family: 'Pix32', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .gate-overlay.is-hidden {
            display: none;
        }

        .gate-text {
            font-size: 16px;
            letter-spacing: 2px;
            opacity: 0.65;
            animation: gate-pulse 1.6s ease-in-out infinite;
            text-align: center;
            line-height: 1.6;
            padding: 0 20px;
        }

        @keyframes gate-pulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 0.85; }
        }
    </style>
</head>
<body>

    <audio id="boot-audio" preload="auto">
        <source src="audio/boot.mp3" type="audio/mpeg">
    </audio>

    <audio id="day-audio" preload="auto">
        <source src="audio/day.mp3" type="audio/mpeg">
    </audio>

    <!-- Click-to-start gate (needed to unlock autoplay) -->
    <div class="gate-overlay" id="gate-overlay" role="button" tabindex="0" aria-label="Click to begin">
        <div class="gate-text">click to begin</div>
    </div>

    <div class="intro-overlay" id="intro-overlay" aria-hidden="true">
        <img src="images/start_menu/windose20.png" alt="" class="intro-image" id="intro-image">
    </div>

    <div class="fade-overlay" id="fade-overlay"></div>

    <div class="app-window">

        <div class="top-bar">
            <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M4 20h3v-2h4v4h2v-4h4v2h-2v4H9v-4H7v2H2v-5h2v3Zm18 2h-5v-2h3v-3h2v5ZM6 11H2v2h4v4H4v-2H0V9h4V7h2v4Zm14-2h4v6h-4v2h-2v-4h4v-2h-4V7h2v2Zm-6 7h-4v-2h4v2Zm-4-2H8v-4h2v4Zm6 0h-2v-4h2v4Zm-2-4h-4V8h4v2ZM7 4H4v3H2V2h5v2Zm8 0h2V2h5v5h-2V4h-3v2h-4V2h-2v4H7V4h2V0h6v4Z"/></svg>
        </div>

        <div class="main-body">
            <div class="left-half">
                <span class="welcome-text">Welcome</span>
            </div>

            <div class="right-half">
                <a href="desktop.html" id="enter-link" style="display: flex; justify-content: center; align-items: center; text-decoration: none;">
                    <div class="sprite-placeholder">
                        <img src="images/kangel/kangel_icon.jpg" alt="Character Sprite">
                    </div>
                </a>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-icons">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M18 22H6v-2h12v2ZM6 20H4v-2h2v2Zm14 0h-2v-2h2v2ZM4 18H2V8h2v10Zm18 0h-2V8h2v10Zm-9-7h-2V2h2v9ZM6 8H4V6h2v2Zm14 0h-2V6h2v2ZM8 6H6V4h2v2Zm10 0h-2V4h2v2Z"/></svg>
            </div>

            <div class="blue-blocks-container">
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
                <div class="blue-block"></div>
            </div>

            <div class="bottom-icons">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M20 20H4v-2h16v2ZM4 18H2V6h2v12Zm18 0h-2V6h2v12Zm-8-4h-4v-2h4v2Zm-4-2H8v-2h2v2Zm6 0h-2v-2h2v2Zm-8-2H6V8h2v2Zm10 0h-2V8h2v2Zm2-4H4V4h16v2Z"/></svg>
            </div>
        </div>

    </div>

    <script>
    /* ============================================
       CLICK-TO-START GATE + BOOT AUDIO + INTRO
       ============================================ */
    (function () {
        const gate      = document.getElementById('gate-overlay');
        const bootAudio = document.getElementById('boot-audio');
        const introOv   = document.getElementById('intro-overlay');
        const introImg  = document.getElementById('intro-image');

        if (!gate || !introOv || !introImg) return;

        const FADE_DURATION = 1500;
        const HOLD_DURATION = 5500;

        let started = false;

        function runIntro() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    introImg.classList.add('is-visible');
                });
            });

            setTimeout(() => {
                introImg.classList.remove('is-visible');
            }, FADE_DURATION + HOLD_DURATION);

            setTimeout(() => {
                introOv.classList.add('is-hidden');
            }, FADE_DURATION + HOLD_DURATION + FADE_DURATION);

            setTimeout(() => {
                introOv.remove();
            }, FADE_DURATION + HOLD_DURATION + FADE_DURATION + FADE_DURATION);
        }

        function start() {
            if (started) return;
            started = true;

            // 1. Play boot.mp3 — user gesture unlocks this
            if (bootAudio) {
                bootAudio.currentTime = 0;
                bootAudio.play().catch(() => {});
            }

            // 2. Remove gate
            gate.classList.add('is-hidden');

            // 3. Kick off intro (wait for image if not yet loaded)
            if (introImg.complete) {
                runIntro();
            } else {
                introImg.addEventListener('load',  runIntro, { once: true });
                introImg.addEventListener('error', runIntro, { once: true });
            }
        }

        gate.addEventListener('click', start);
        gate.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                start();
            }
        });
    })();

    /* ============================================
       EXIT SEQUENCE
         Click kangel → play day.mp3 → wait 2s →
         fade to black over 1.5s → navigate to desktop.html
       ============================================ */
    (function () {
        const enterLink   = document.getElementById('enter-link');
        const dayAudio    = document.getElementById('day-audio');
        const fadeOverlay = document.getElementById('fade-overlay');

        if (!enterLink || !fadeOverlay) return;

        let started = false;

        enterLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (started) return;
            started = true;

            if (dayAudio) {
                dayAudio.currentTime = 0;
                dayAudio.play().catch(() => {});
            }

            setTimeout(() => {
                fadeOverlay.classList.add('is-active');

                setTimeout(() => {
                    window.location.href = 'desktop.html';
                }, 1500);
            }, 2000);
        });
    })();
    </script>

</body>
</html>
